<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Salud</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">
        <h1>Encuesta de Salud</h1>

        <form>

            <!-- Nombre -->
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" required>

            <!-- Edad -->
            <label for="edad">Edad:</label>
            <input type="number" id="edad" min="1" max="120" required>

            <!-- Peso -->
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" min="20" max="300" required>

            <!-- Nivel de dolor -->
            <label for="dolor">
                Nivel de dolor (0 a 10):
            </label>

            <input type="range"
                   id="dolor"
                   min="0"
                   max="10"
                   value="5"
                   oninput="valorDolor.textContent = this.value">

            <span id="valorDolor">5</span>

            <!-- Tipo de sangre -->
            <label for="sangre">Tipo de sangre:</label>

            <select id="sangre" required>
                <option value="">Selecciona</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <!-- Código Postal -->
            <label for="cp">Código Postal:</label>

            <input type="text"
                   id="cp"
                   pattern="[0-9]{5}"
                   maxlength="5"
                   placeholder="Ejemplo: 12345"
                   required>

            <small>Debe contener exactamente 5 números.</small>

            <!-- Botón -->
            <button type="submit">Enviar Encuesta</button>

        </form>
    </div>

</body>
</html>
